#
# 构建极光盒子 7X（BA002）适配版，并验证产物确实是适配过的。
#
# 上游 CI（.github/workflows/build.yml）编译的是纯上游版本。这个工作流只做一件事：
# 产出可以装到 BA002 上并长期当默认桌面的 APK，顺带把产物结构验一遍 ——
# 因为「构建成功」和「能当桌面」是两件不同的事，前者不能证明后者。
#
# 需要配置 Secrets：
#   BA002_KEYSTORE_BASE64    private/ba002.p12 的 base64
#   BA002_STORE_PASSWORD     签名库口令
#   BA002_KEY_ALIAS          签名库别名（可选，默认 marco）
#
# 没有配 Secrets 时会跳过着色步骤并在日志里警告，产物不可用于发布。

name: Build BA002 adaptation

on:
  push:
    paths:
      - 'ba002/**'
      - 'app/**'
      - '.github/workflows/ba002.yml'
  pull_request:
    paths:
      - 'ba002/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  MARCOTV_BUILD_TOOLS: '36.0.0'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Prepare upstream toolchain (API 28)
        run: python scripts/bootstrap.py

      - name: Restore signing keystore
        shell: pwsh
        env:
          KEYSTORE_B64: ${{ secrets.BA002_KEYSTORE_BASE64 }}
        run: |
          if (-not $env:KEYSTORE_B64) {
            Write-Warning "BA002_KEYSTORE_BASE64 未配置，本次构建用一次性开发密钥，不可用于发布"
            exit 0
          }
          $dir = Join-Path $PWD 'private'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $bytes = [Convert]::FromBase64String($env:KEYSTORE_B64)
          [IO.File]::WriteAllBytes((Join-Path $dir 'ba002.p12'), $bytes)

      - name: Adapt and build
        env:
          BA002_STORE_PASSWORD: ${{ secrets.BA002_STORE_PASSWORD }}
          BA002_KEY_ALIAS: ${{ secrets.BA002_KEY_ALIAS }}
        run: python ba002/build.py

      - name: Verify the artifact is actually adapted
        shell: pwsh
        run: |
          $apk = Get-ChildItem dist-ba002/*.apk | Select-Object -First 1
          $badging = & "$env:ANDROID_SDK_ROOT/build-tools/$env:MARCOTV_BUILD_TOOLS/aapt2.exe" dump badging $apk.FullName
          $manifest = & "$env:ANDROID_SDK_ROOT/build-tools/$env:MARCOTV_BUILD_TOOLS/aapt2.exe" dump xmltree --file AndroidManifest.xml $apk.FullName

          $failures = @()

          # 包名必须落在固件的 HOME 白名单前缀下，否则装上也当不了桌面
          if ($badging -notmatch "package: name='com\.xiaopaitech\.plauncher\.marcotv'") {
            $failures += "包名不正确（必须命中 enable_launcher_components 的前缀）"
          }
          # 版本号要与上游对齐
          if ($badging -notmatch "versionName='0\.21\.3'") {
            $failures += "versionName 与上游不对齐"
          }
          # 别名要静态启用
          if ($manifest -notmatch 'HomeActivity') {
            $failures += "缺少 HomeActivity 别名"
          }
          # 抢前台接收器要在
          if ($manifest -notmatch 'Ba002BootRelay') {
            $failures += "缺少 Ba002BootRelay"
          }
          # HOME 声明必须唯一（多个会导致每次按 HOME 都弹选择框）
          $homeCount = ([regex]::Matches($manifest, 'android\.intent\.category\.HOME')).Count
          if ($homeCount -ne 1) {
            $failures += "HOME 声明有 $homeCount 处，必须恰好 1 处"
          }

          if ($failures.Count) {
            $failures | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host "产物校验通过：包名、版本、别名、relay、HOME 唯一性全部符合"

      - uses: actions/upload-artifact@v4
        with:
          name: MarcoTV-BA002
          path: dist-ba002/*
          retention-days: 14
