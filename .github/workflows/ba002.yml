#
# 构建极光盒子 7X（BA002）适配版，并验证产物确实是适配过的。
#
# 上游 CI（.github/workflows/build.yml）编译的是纯上游版本。这个工作流只做一件事：
# 产出可以装到 BA002 上并长期当默认桌面的 APK，顺带把产物结构验一遍 ——
# 因为「构建成功」和「能当桌面」是两件不同的事，前者不能证明后者。
#
# 需要配置 Secrets：
#   BA002_KEYSTORE_BASE64    private/ba002.p12 的 base64
#   BA002_STORE_PASSWORD     签名库口令
#   BA002_KEY_ALIAS          签名库别名（可选，默认 marco）
#
# 没有配 Secrets 时会跳过着色步骤并在日志里警告，产物不可用于发布。

name: Build BA002 adaptation

on:
  push:
    paths:
      - 'ba002/**'
      - 'app/**'
      - '.github/workflows/ba002.yml'
  pull_request:
    paths:
      - 'ba002/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  MARCOTV_BUILD_TOOLS: '36.0.0'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Prepare upstream toolchain (API 28)
        run: python scripts/bootstrap.py

      - name: Restore signing keystore
        shell: pwsh
        env:
          KEYSTORE_B64: ${{ secrets.BA002_KEYSTORE_BASE64 }}
        run: |
          if (-not $env:KEYSTORE_B64) {
            Write-Warning "BA002_KEYSTORE_BASE64 未配置，本次构建用一次性开发密钥，不可用于发布"
            exit 0
          }
          $dir = Join-Path $PWD 'private'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $bytes = [Convert]::FromBase64String($env:KEYSTORE_B64)
          [IO.File]::WriteAllBytes((Join-Path $dir 'ba002.p12'), $bytes)

      - name: Offline relay policy checks
        # relay 的「是否已在前台」判定写错过两次，都只有装到真机打 logcat 才暴露。
        # 抽成 Ba002RelayPolicy 后在这里跑完所有分支，真机只用来确认最终效果。
        run: python ba002/test_relay.py

      - name: Adapt and build
        env:
          BA002_STORE_PASSWORD: ${{ secrets.BA002_STORE_PASSWORD }}
          BA002_KEY_ALIAS: ${{ secrets.BA002_KEY_ALIAS }}
        shell: pwsh
        run: |
          # 空 secret 在 Windows 上会变成空字符串环境变量，上游会拿它当口令去
          # 建钥匙，结果签不上。显式清掉，让上游用自己的默认值。
          if (-not $env:BA002_STORE_PASSWORD) { Remove-Item Env:BA002_STORE_PASSWORD -ErrorAction SilentlyContinue }
          if (-not $env:BA002_KEY_ALIAS)      { Remove-Item Env:BA002_KEY_ALIAS -ErrorAction SilentlyContinue }
          python ba002/build.py

      - name: Verify the artifact is actually adapted
        shell: pwsh
        run: |
          # aapt2 从 bootstrap 装好的 toolchain.json 取，不依赖 runner 预置 SDK 的版本号
          $tc = Get-Content .tools/toolchain.json | ConvertFrom-Json
          $aapt2 = Join-Path $tc.build_tools 'aapt2.exe'
          if (-not (Test-Path $aapt2)) { Write-Error "找不到 aapt2: $aapt2"; exit 1 }

          $apk = Get-ChildItem dist-ba002/*.apk | Select-Object -First 1
          if (-not $apk) { Write-Error "dist-ba002 里没有 APK"; exit 1 }

          # aapt2 输出是多行，PowerShell 会存成 string[]。
          # 对数组用 -match/-notmatch 得到的是「匹配到的元素」而非布尔值，
          # if 判定会恒为真。所以先拼成单个字符串再匹配。
          $badging  = (& $aapt2 dump badging $apk.FullName) -join "`n"
          $manifest = (& $aapt2 dump xmltree --file AndroidManifest.xml $apk.FullName) -join "`n"

          # 期望值不写死：包名读 adapt.py，版本号读上游未改动的 manifest。
          # 上游发新版时这两个值会自动跟进，不用回来改工作流。
          $adaptSrc = Get-Content ba002/adapt.py -Raw
          if ($adaptSrc -notmatch 'NEW_PKG = "([^"]+)"') { Write-Error "adapt.py 里没有 NEW_PKG"; exit 1 }
          $expectedPkg = $Matches[1]

          [xml]$srcManifest = Get-Content app/src/main/AndroidManifest.xml -Raw -Encoding utf8
          $expectedVersion = $srcManifest.manifest.versionName

          $failures = @()

          # ① 包名必须落在固件 HOME 白名单的前缀下，否则装上也当不了桌面
          if ($badging -notmatch [regex]::Escape("package: name='$expectedPkg'")) {
            $failures += "包名不是 $expectedPkg（必须命中 enable_launcher_components 的前缀）"
          }
          # ② 版本号要与上游 manifest 一致
          if ($badging -notmatch [regex]::Escape("versionName='$expectedVersion'")) {
            $failures += "versionName 不是 $expectedVersion，与上游不对齐"
          }
          # ③ HOME 别名要在 APK 里
          if ($manifest -notmatch 'HomeActivity') {
            $failures += "缺少 HomeActivity 别名"
          }
          # ④ 抢前台接收器要在
          if ($manifest -notmatch 'Ba002BootRelay') {
            $failures += "缺少 Ba002BootRelay"
          }
          # ⑤ HOME 声明必须唯一：同包多个 HOME 组件会让
          #    PreferredComponent.sameSet() 校验失效，表现为每次按 HOME 都弹选择框。
          #    aapt2 把同一个属性打成「值 + Raw: 值」在同一行，所以按行数计。
          $homeCount = @($manifest -split "`n" | Where-Object { $_ -match 'category\.HOME"' }).Count
          if ($homeCount -ne 1) {
            $failures += "HOME 声明有 $homeCount 行，必须恰好 1 行"
          }

          if ($failures.Count) {
            $failures | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host "产物校验通过"
          Write-Host "  包名     $expectedPkg"
          Write-Host "  版本     $expectedVersion"
          Write-Host "  别名     HomeActivity 已启用"
          Write-Host "  relay    Ba002BootRelay 已就位"
          Write-Host "  HOME     声明唯一"
      - uses: actions/upload-artifact@v4
        with:
          name: MarcoTV-BA002
          path: dist-ba002/*
          retention-days: 14
